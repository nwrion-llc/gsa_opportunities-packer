name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Packer Build
    uses: ./.github/workflows/call-packer.yml
    secrets: inherit
    with:
      deploy: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
